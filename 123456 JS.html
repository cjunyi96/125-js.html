<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>極致爆炸 JavaScript 練習！</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.1s;
        }

        h1 {
            color: #333;
            transition: color 0.3s;
        }

        /* 按鈕基礎樣式 */
        #explodeBtn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 75, 43, 0.5);
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        #explodeBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 75, 43, 0.7);
        }

        #explodeBtn:active {
            transform: scale(0.95);
        }

        /* 按鈕粉碎消失 */
        .btn-shatter {
            animation: shatterOut 0.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes shatterOut {
            0% { transform: scale(1); opacity: 1; }
            20% { transform: scale(1.2); filter: blur(0px); }
            100% { transform: scale(0); opacity: 0; filter: blur(10px); }
        }

        /* 螢幕震動 */
        .screen-shake {
            animation: shake 0.15s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 爆炸粒子 DOM 樣式 */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            opacity: 0;
            z-index: 5;
            animation: explodeParticle var(--duration) ease-out forwards;
        }

        @keyframes explodeParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body id="theBody">

    <h1>今天練習的 JavaScript</h1>
    
    <!-- 已將文字改成「加入購物車」 -->
    <button id="explodeBtn" onclick="superExplosion(event)">🛒 加入購物車 🛒</button>

    <script>
    function superExplosion(event) {
        const btn = event.target;
        const body = document.getElementById('theBody');
        const h1 = document.querySelector('h1');

        // 1. 視覺效果
        btn.classList.add('btn-shatter');
        body.style.backgroundColor = '#114514'; 
        h1.style.color = '#ffffff';

        // 2. 螢幕震動 + 閃爍特效
        body.classList.add('screen-shake');
        
        let flashInterval = setInterval(() => {
            body.style.backgroundColor = body.style.backgroundColor === 'rgb(17, 69, 20)' ? '#ff0000' : '#114514';
        }, 50);

        setTimeout(() => {
            clearInterval(flashInterval);
            body.classList.remove('screen-shake');
            body.style.backgroundColor = '#114514'; 
        }, 500);

        // 3. 產生大量爆炸粒子
        const rect = btn.getBoundingClientRect();
        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;

        const particleCount = 150; 
        const colors = ['#ff4b2b', '#ff416c', '#ffeb3b', '#ffffff', '#ff9800'];

        for (let i = 0; i < particleCount; i++) {
            createParticle(originX, originY, colors);
        }

        // 4. 彈出購物車成功訊息
        setTimeout(() => {
            alert("🛒💥 成功加入購物車！！💥🛒\n今天好開心來寫網頁程式!!Happy!!");
            
            // 恢復按鈕
            btn.classList.remove('btn-shatter');
            btn.style.opacity = "1"; 
        }, 1000);
    }

    function createParticle(x, y, colors) {
        const p = document.createElement('div');
        p.className = 'particle';
        
        const size = Math.random() * 15 + 5 + 'px';
        p.style.width = size;
        p.style.height = size;
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        if(Math.random() > 0.5) {
            p.style.borderRadius = '0px';
        }

        p.style.left = x + 'px';
        p.style.top = y + 'px';

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 300 + 100; 
        
        const tx = Math.cos(angle) * velocity + 'px';
        const ty = Math.sin(angle) * velocity + 'px';
        const duration = Math.random() * 0.5 + 0.5 + 's';

        p.style.setProperty('--tx', tx);
        p.style.setProperty('--ty', ty);
        p.style.setProperty('--duration', duration);

        document.body.appendChild(p);

        setTimeout(() => {
            p.remove();
        }, 1000);
    }
    </script>
</body>
</html>+
